name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch: {}

# Least privilege: CI only needs to read the code. A compromised step or
# dependency cannot push, open releases or touch Pages.
permissions:
  contents: read

# A newer push to the same branch supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs (with the release in a comment)
      # so a moved or hijacked tag cannot change what runs. Dependabot keeps
      # the pins up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci --ignore-scripts

      # Every installed package must carry a valid registry signature (and
      # provenance attestations, where published, must verify).
      - name: Verify registry signatures
        run: npm audit signatures

      # The engine is a dependency of both the server and the web app.
      - name: Build engine
        run: npm run build -w packages/engine

      - name: Typecheck engine (including tests)
        run: npm run typecheck -w packages/engine

      - name: Typecheck server (including tests)
        run: npm run typecheck -w packages/server

      - name: Typecheck web
        run: npx tsc -b packages/web

      - name: Lint web
        run: npm run lint -w packages/web

      - name: Engine unit tests
        run: npm test -w packages/engine

      - name: Engine self-test (200 simulated matches)
        run: npm run selftest -w packages/engine

      - name: Server attack tests
        run: npm test -w packages/server

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build web
        run: npm run build -w packages/web
